name: Lindroid pipa (Lineage + Magisk)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: LineageOS android_kernel_xiaomi_sm8250 branch
        required: true
        default: lineage-22.2
        type: choice
        options:
          - lineage-21
          - lineage-22.1
          - lineage-22.2
          - lineage-23.0
          - lineage-23.2
      aosp_tag:
        description: AOSP tag for LindroidUI Magisk build
        required: true
        default: android-14.0.0_r75
        type: string
      create_release:
        description: Publish GitHub Release with kernel + Magisk zip
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: lindroid-pipa-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}
  AOSP_TAG: ${{ github.event.inputs.aosp_tag || 'android-14.0.0_r75' }}

jobs:
  kernel:
    name: Build Lindroid kernel (pipa)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential flex bison libssl-dev \
            libelf-dev bc zip ccache python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses-dev dwarves

      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache-dir
          key: ccache-kernel-${{ env.KERNEL_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-kernel-${{ env.KERNEL_BRANCH }}-
            ccache-kernel-

      - name: Build kernel + AnyKernel3
        run: |
          chmod +x kernel/integrate-drm.sh scripts/*.sh
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache-dir"
          export USE_CCACHE=1
          mkdir -p "$CCACHE_DIR"
          ./scripts/ci-kernel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lindroid-pipa-kernel
          path: |
            artifacts/lindroid-pipa-anykernel.zip
            artifacts/lindroid-pipa-kernel-*.zip
            artifacts/Image
            artifacts/kernel.config
            artifacts/lindroid.config
            artifacts/pipa.config
            artifacts/build.log
          if-no-files-found: error
          compression-level: 0

  magisk:
    name: Build LindroidUI Magisk module
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl zip unzip python3 python-is-python3 \
            openjdk-17-jdk rsync libxml2-utils xsltproc

      - name: Build LindroidUI + Magisk zip
        env:
          AOSP_TAG: ${{ env.AOSP_TAG }}
          LINDROID_REF: lindroid-21
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-magisk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lindroid-pipa-magisk
          path: |
            artifacts/lindroid-pipa-magisk.zip
            artifacts/install-magisk.md
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [kernel, magisk]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lindroid-pipa-kernel
          path: release/kernel

      - uses: actions/download-artifact@v4
        with:
          name: lindroid-pipa-magisk
          path: release/magisk

      - name: Stage release assets
        id: stage
        run: |
          mkdir -p dist
          cp -f release/kernel/lindroid-pipa-anykernel.zip dist/ || true
          cp -f release/kernel/lindroid-pipa-kernel-*.zip dist/ 2>/dev/null || true
          cp -f release/kernel/Image dist/Image || true
          cp -f release/kernel/kernel.config dist/ || true
          cp -f release/magisk/lindroid-pipa-magisk.zip dist/ || true
          cp -f release/magisk/install-magisk.md dist/ 2>/dev/null || true
          ls -lh dist/
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${KERNEL_BRANCH}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: Lindroid pipa ${{ steps.stage.outputs.tag }}
          body: |
            ## Artifacts
            - **lindroid-pipa-anykernel.zip** — Lindroid kernel (AnyKernel3, `pipa`)
            - **Image** — raw kernel image
            - **lindroid-pipa-magisk.zip** — Magisk module with **CI-built LindroidUI** + libs (`${{ env.AOSP_TAG }}` / `aosp_arm64`)

            Kernel branch: `${{ env.KERNEL_BRANCH }}`
            SELinux: `setenforce 0` before first LindroidUI launch.

            See [docs/install-magisk.md](https://github.com/${{ github.repository }}/blob/main/docs/install-magisk.md).
          files: dist/*
          generate_release_notes: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
