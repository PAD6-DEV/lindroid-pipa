name: Lindroid pipa (Lineage + Magisk)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lindroid-pipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel Lindroid EVDI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential flex bison libssl-dev libelf-dev bc zip

      - name: Integrate DRM + config
        run: |
          chmod +x kernel/integrate-drm.sh scripts/*.sh
          ./scripts/ci-kernel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lindroid-pipa-kernel
          path: artifacts/
          if-no-files-found: error

  magisk:
    name: Magisk module zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package module
        run: |
          sudo apt-get update
          sudo apt-get install -y zip curl
          chmod +x scripts/ci-magisk.sh
          ./scripts/ci-magisk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lindroid-pipa-magisk
          path: artifacts/
          if-no-files-found: error
