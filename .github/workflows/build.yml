name: Lindroid pipa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_rom:
        description: "Run full Lineage+Lindroid ROM build (needs self-hosted runner)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lindroid-pipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel Lindroid EVDI (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential flex bison libssl-dev libelf-dev bc

      - name: Integrate DRM + config fragment
        run: |
          chmod +x kernel/integrate-drm.sh scripts/ci-kernel.sh
          ./scripts/ci-kernel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lindroid-pipa-kernel-prep
          path: artifacts/
          if-no-files-found: error

  rom:
    name: Full Lineage 21 + Lindroid ROM
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rom }}
    runs-on: [self-hosted, linux, lindroid-pipa]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Install repo + deps
        run: |
          chmod +x scripts/*.sh kernel/*.sh
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            rsync libssl-dev libelf-dev bc
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo
          git config --global user.email "ci@pad6.dev"
          git config --global user.name "Lindroid pipa CI"

      - name: Sync
        env:
          ANDROID_BUILD_TOP: ${{ github.workspace }}/android
          SYNC_JOBS: "8"
        run: ./scripts/ci-sync.sh
        timeout-minutes: 240

      - name: Prepare Lindroid
        env:
          ANDROID_BUILD_TOP: ${{ github.workspace }}/android
        run: ./scripts/ci-prepare.sh

      - name: Build
        env:
          ANDROID_BUILD_TOP: ${{ github.workspace }}/android
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          BUILD_JOBS: "8"
        run: ./scripts/ci-build.sh
        timeout-minutes: 480

      - uses: actions/upload-artifact@v4
        with:
          name: lindroid-pipa-rom
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
